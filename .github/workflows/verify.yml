name: Verify PHP runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PHP_SOURCE_VERSION: 8.5.12
      PHP_SOURCE_SHA256: 08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/storage/app/mvp-evidence/ci-browsers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read tested PHP patch
        id: runtime
        run: echo "php=$(cat .php-version)" >> "$GITHUB_OUTPUT"
      # setup-php resolves a minor's latest patch; only use it to bootstrap Composer.
      - name: Bootstrap Composer tools
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ steps.runtime.outputs.php }}
          extensions: curl, dom, fileinfo, mbstring, openssl, pcntl, pdo_mysql, pdo_sqlite, posix, session, sqlite3, tokenizer, xml
          tools: composer:2.10.3
          coverage: none
      - name: Build isolated exact PHP CLI
        timeout-minutes: 20
        run: bash .github/ci/build-php-cli.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Assert persisted PHP runtime and private configuration
        run: |
          test "$(command -v php)" = "$PHP_BIN"
          test "$("$PHP_BIN" -r 'echo PHP_BINARY;')" = "$PHP_BIN"
          test "$("$PHP_BIN" -r 'echo PHP_VERSION;')" = "$(cat .php-version)"
          expected_ini="$PHPRC/php.ini"
          "$PHP_BIN" -r 'if (php_ini_loaded_file() !== $argv[1] || php_ini_scanned_files() !== false) { fwrite(STDERR, "Unexpected PHP ini configuration\n"); exit(1); } echo "PASS private PHP ini\n";' "$expected_ini"
          env -u PHPRC -u PHP_INI_SCAN_DIR "$PHP_BIN" -r 'if (php_ini_loaded_file() !== $argv[1] || php_ini_scanned_files() !== false) { fwrite(STDERR, "Unexpected compiled PHP ini defaults\n"); exit(1); } echo "PASS compiled private PHP ini defaults\n";' "$expected_ini"
          "$PHP_BIN" scripts/runtime-preflight.php
          "$PHP_BIN" -r '$required = ["curl","dom","fileinfo","mbstring","openssl","pcntl","pdo_mysql","pdo_sqlite","posix","session","sqlite3","tokenizer","xml","ctype","filter","hash","iconv","json","libxml","pcre","phar","xmlwriter","xmlreader","SimpleXML","zlib"]; foreach ($required as $ext) { if (!extension_loaded($ext)) { fwrite(STDERR,"Missing $ext\n"); exit(1); } } if (!function_exists("mb_ereg")) { exit(1); } echo "PASS full CI extension set and mbregex\n";'
          "$PHP_BIN" --ini
          "$PHP_BIN" -m
          if [[ "$RUNNER_OS" == macOS ]]; then
            otool -L "$PHP_BIN"
            "$PHP_BIN" -r 'echo OPENSSL_VERSION_TEXT, "\n", curl_version()["ssl_version"], "\n";'
          fi
      - name: Reject corrupted PHP source
        run: |
          corrupt_archive="$RUNNER_TEMP/corrupt-php.tar.xz"
          cp "$PHP_SOURCE_ARCHIVE" "$corrupt_archive"
          printf 'CORRUPT' >> "$corrupt_archive"
          if bash .github/ci/build-php-cli.sh --verify-only "$corrupt_archive" > "$RUNNER_TEMP/php-checksum-negative.log" 2>&1; then
            echo 'Corrupted PHP source was accepted' >&2
            exit 1
          fi
          grep -F 'PHP source checksum mismatch' "$RUNNER_TEMP/php-checksum-negative.log"
      - name: Install locked dependencies
        id: dependencies
        run: |
          ./scripts/composer install --no-interaction --prefer-dist
          ./scripts/composer validate --strict
          ./scripts/composer check-platform-reqs
          npm install --prefix "$RUNNER_TEMP/ops01-pnpm" --no-audit --no-fund pnpm@12.16.1
          echo "$RUNNER_TEMP/ops01-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ops01-pnpm/node_modules/.bin/pnpm" install --frozen-lockfile --strict-peer-dependencies
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Full verification
        run: ./scripts/verify.sh
      - name: Read-only server runtime preflight
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ./scripts/server-preflight.sh
      - name: Real disposable database workers
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          test "$(command -v php)" = "$PHP_BIN"
          "$PHP_BIN" scripts/verify-mvp-worker.php
          "$PHP_BIN" scripts/verify-automation-worker.php
          "$PHP_BIN" scripts/verify-deployment.php
      - name: Browser journeys with fake provider and compiled assets
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          node scripts/verify-presentation-browser.mjs
          node scripts/verify-tutorial-browser.mjs
          node scripts/verify-deployment-browser.mjs
          for scenario in mining setup uncertain rejected recovery preparation; do
            QA_GUIDED_SCENARIO="$scenario" node scripts/verify-guided-browser.mjs
          done
      - name: Native owned engine and Start/Stop browser journey
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.dependencies.outcome == 'success' }}
        run: |
          test "$(command -v php)" = "$PHP_BIN"
          "$PHP_BIN" scripts/verify-local-engine.php
          node scripts/verify-automation-browser.mjs
