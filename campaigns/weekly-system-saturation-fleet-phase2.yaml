# Bootstrap the probe mesh, then expand verified home-system trade and extraction capacity.
# Rollout (§7.5): start Phase 1 with compression on the existing exclusive lock.
# After six hours of telemetry, enable D3 per-ship locks, then enable corridor chains.
# Enable extraction in Phase 2. Enable stationary extraction and stimulation in Phase 3.
name: weekly-system-saturation-fleet
version: 1
agent: { symbol: GIANTSOUP, faction: VOID }
limits:
  reserve_credits: 0
  fuel_reserve: next_leg
  run_max_minutes: 90
probes:
  target: 4
  max_price: 50000
  min_working_capital: 75000
  pool: true
  mesh:
    max_probes: 32
    base: 4
    per_trader: 2
    read_interval_seconds: 300
    demand_read_interval_seconds: 120
    reads_per_pass: 8
    dispatches_per_pass: 4
    saturation:
      tier2: true
      demand_max: 8
      tier2_read_interval_seconds: 1800
      yard_read_interval_seconds: 900
      purchase_yard_read_interval_seconds: 300
      patrol_quality_pct: 50
      value_seconds: 3600
      hysteresis_seconds: 900
      min_dwell_seconds: 600
      patrol_quote_min_age_seconds: 300
      patrol_cooldown_seconds: 600
      yard_recovery_cooldown_seconds: 900
      travel_credits_per_second: 5
      free_capital_share_pct: 50
      proof_fuel_buffer_credits: 15000
      tier2_price_inflation_cap_pct: 25
      stop_purchases_hours_before_reset: 12
      governor_headroom_pct: 90
fleet:
  haulers:
    ship_type: SHIP_LIGHT_HAULER
    max_haulers: 16
    max_price: 600000
    max_concurrent_purchases: 1
    min_working_capital: 200000
    working_capital_per_trader: 150000
    payback_fraction: 0.33
    assumed_net_per_hour: 40000
    min_unclaimed_score: 1500
    min_marginal_net_per_hour: 25000
    max_idle_share: 0.25
    min_hub_coverage: 0.8
    stop_hours_before_reset: 24
    request_headroom: 0.8
    scheduler: { max_idle_arm_wait_seconds: 180, max_dispatch_lag_seconds: 30, max_queue_depth: 20 }
  auto_arm:
    revision_hash: d6cd2f0c271ac89f77064aaa6bd9b9676b71b358f653512b5d6061b4a7f7a3bb
    label_prefix: H
    frames: [FRAME_LIGHT_FREIGHTER, FRAME_SHUTTLE]
    max_net_loss: 100000
    exposure_share: 0.5
  saturation:
    enabled: true
    compression: true
    per_ship_noncredit_locks: false
    chain_max_age_seconds: 120
    credit_refresh_seconds: 300
    price_preflight_max_seconds: 10
    reprice_tolerance_pct: 3
    fleet_sync_seconds: 300
    start_band_price_pct: 5
    start_band_profit_pct: 10
    start_band_profit_min_credits: 2000
    pipeline_grace_seconds: 60
    run_hard_cap_seconds: 5400
    acquisition_default_floor_seconds: 900
    auto_arm_frames: [FRAME_LIGHT_FREIGHTER, FRAME_SHUTTLE]
    stop_overhead_seconds: 30
    hurdle_permille: 100
    hull_inflation_cap_pct: 15
    drone_inflation_cap_pct: 25
    max_prices:
      SHIP_LIGHT_HAULER: 600000
      SHIP_LIGHT_SHUTTLE: 150000
      SHIP_MINING_DRONE: 60000
      SHIP_SIPHON_DRONE: 60000
      SHIP_SURVEYOR: 50000
    max_haulers: 16
    max_shuttles: 16
    corridor:
      chains_enabled: false
      recovery_seconds_prior: 1800
      side_depth_batches: 7
      chain_seed: 12
      max_chain_legs: 3
      stale_seconds: 900
    stimulation:
      enabled: false
      beta_permille_prior: 20
      bonus_cap_credits: 10000
      cycle_loss_credits: 0
      episode_loss_cap_credits: 50000
    extraction:
      enabled: true
      stationary: false
      max_extractions_per_minute: 8
      safety_permille: 750
      max_miners: 16
      max_siphons: 8
      max_surveyors: 2
      canary_receipts: 20
      canary_free_cash_credits: 1000000
      headroom_prior_units: 7
      survey_margin_permille: 50
      demand_slots: 2
      jettison_cap_credits_per_hour: 5000
      jettison_allowlist: [ICE_WATER, QUARTZ_SAND, AMMONIA_ICE, SILICON_CRYSTALS]
      lease_ttl_seconds: 60
      tender_wait_seconds: 120
      drift_margin_seconds: 1800
      extraction_starts_per_pass: 6
      allow_debris: false
    lambda:
      low_permille: 600
      resume_permille: 850
      high_permille: 900
      max_step_credits: 5
      resume_passes: 3
trade:
  proof: { max_units_batches: 1, max_credits: 60000, min_realized_ratio: 0.8 }
  lot: { max_buyer_batches: 5, first_scaled_max_buyer_batches: 3, default_batch_decay: 0.04 }
  losses: { losing_load: reprove, pause_after_consecutive_losing_loads: 2 }
  switch: { bid_below_first_seen: 0.9, better_pair_ratio: 1.1 }
  quote_max_age_seconds: 180
phases:
  - id: discover
    exit: { any: [ { minutes_elapsed_gte: 90 }, { markets_observed_gte: 8 }, { positive_spread_gte: 1 } ] }
    activities: [ { role: command, strategy: scout }, { role: probe, strategy: scout } ]
  - id: earn
    exit: { hours_to_reset_lte: 1 }
    activities:
      - { role: command, strategy: trade }
      - { role: probe, strategy: scout }
  - id: wind_down
    activities: [ { role: command, strategy: sell_aboard } ]
predictions:
  - { metric: proof_realized_ratio, gte: 0.8 }
  - { metric: minutes_to_first_profit, lte: 30 }
  - { metric: freshness_holds, lte: 2 }
