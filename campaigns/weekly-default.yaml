# Hypothesis: one-batch proofs validate the spread before three-batch and five-batch loads.
# v2 (2026-11-15): a fresh wipe knows prices only where its two ships sit. v1 left discover after
# 15 minutes with 2 priced markets and then idled. v2 scouts until 8 markets have prices (or 90
# minutes) and lets the probe keep scouting in earn whenever no trade is feasible.
# v3 (2026-11-16): the mining fallback earned nothing and made every other earn tick skip trade, so
# it is removed. Proofs may spend 60000 (one full buyer batch of the top goods) instead of 10000.
# v4 (2026-11-16): fast start. Discover also leaves on the first positive spread the command ship
# could trade, and the command ship first reads markets at its own coordinates (distance 0 only;
# it never crosses the system to scout) before the probe scouts the rest.
name: weekly-default
version: 1
agent: { symbol: GIANTSOUP, faction: VOID }
limits:
  reserve_credits: 0
  fuel_reserve: next_leg
  run_max_minutes: 15
trade:
  proof: { max_units_batches: 1, max_credits: 60000, min_realized_ratio: 0.8 }
  lot: { max_buyer_batches: 5, first_scaled_max_buyer_batches: 3, default_batch_decay: 0.04 }
  losses: { losing_load: reprove, pause_after_consecutive_losing_loads: 2 }
  switch: { bid_below_first_seen: 0.9, better_pair_ratio: 1.1 }
  quote_max_age_seconds: 180
phases:
  - id: discover
    exit: { any: [ { minutes_elapsed_gte: 90 }, { markets_observed_gte: 8 }, { positive_spread_gte: 1 } ] }
    activities: [ { role: command, strategy: scout }, { role: probe, strategy: scout } ]
  - id: earn
    exit: { hours_to_reset_lte: 1 }
    activities:
      - { role: command, strategy: trade }
      - { role: probe, strategy: scout }
  - id: wind_down
    activities: [ { role: command, strategy: sell_aboard } ]
predictions:
  - { metric: proof_realized_ratio, gte: 0.8 }
  - { metric: minutes_to_first_profit, lte: 45 }
  - { metric: freshness_holds, lte: 2 }
